<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放學後社團體驗表</title>
</head>
<body>

<h1>放學後社團體驗表</h1>
這是介面練習,資料不會送出或保存,不能當成正式報名。
　<p>
    <label for="nickname">我的暱稱</label>
    <input id="nickname" name="nickname" type="text" placeholder="提示:例如小星星
">
  </p>

  <p>
    <label for="workshop">想體驗的社團</label>
    <select id="workshop" name="workshop">
      <option value="">請選擇活動</option>
      <option value="story">故事劇場</option>
      <option value="science">科學手作</option>
      <option value="table">桌遊挑戰</option>
    </select>
  </p>
<fieldset>
    <legend>方便參加的日子</legend>
    <p><label><input type="radio" name="session" value="Tuesday"> 星期二</label></p>
    <p><label><input type="radio" name="session" value="Thursday"> 星期四</label></p>
    <p><label><input type="radio" name="session" value="Friday"> 星期五</label></p>
  </fieldset>

    <legend>我期待的活動方式</legend>
    <p><label><input type="checkbox" name="skills" value="handmake"> 動手製作</label></p>
    <p><label><input type="checkbox" name="skills" value="classemate"> 和同學合作</label></p>
    <p><label><input type="checkbox" name="skills" value="share"> 上台分享</label></p>
  </fieldset>

  <p>
    <label for="message">想告訴老師的事</label><br>
    <textarea id="message" name="message" rows="5" cols="32" placeholder="提示:例如我想和同學一起完成一個小作品"></textarea>
  </p>


       <label>
            <input type="radio" name="experience" value="yes">
            有相關經驗
        </label>
    </p>

    <p>
        <label>
            <input type="radio" name="experience" value="no">
            沒有相關經驗
        </label>
    </p>
</fieldset>

<p>用單選是因為有沒有相關經驗不會同時存在</p>


<button type="button" disabled>練習版，尚未開放報名</button>


</body>
</html>
