<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>從電腦版變成手機版｜楊千葳</title>
<style>
* { box-sizing: border-box; }
body { margin: 24px; font-family: "Microsoft JhengHei", sans-serif; color: #3F3530; background: #F6F0E8; line-height: 1.7; }
h1 { line-height: 1.3; color: #6B5548; }
.note { padding: 14px; background: #EDE2D4; border-radius: 12px; }
.page { width: 100%; max-width: 960px; margin: 0 auto; background: #FFFDF9; padding: 24px; border-radius: 16px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.card { border: 1px solid #D8C9BD; padding: 16px; border-radius: 12px; }
input { width: 100%; max-width: 420px; padding: 10px; font: inherit; border: 1px solid #CFC2B5; border-radius: 8px; }
@media (max-width: 600px) {
  .page { padding: 18px; }
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<h1>從電腦版變成手機版</h1>
<p class="note">活動 08：我修正固定寬度、輸入欄位寬度，並加入 600px 以下的單欄 RWD。不能用 overflow-x: hidden 把超出內容藏起來。</p>

<main class="page">
  <h2>我的作品展</h2>
  <div class="cards">
    <article class="card"><h3>避震任務</h3><p>以地震防災知識為主題的遊戲式教材。</p></article>
    <article class="card"><h3>布農族文化數位教材</h3><p>將多元文化教育內容轉化為數位教材與互動活動。</p></article>
    <article class="card"><h3>課程與教學設計</h3><p>整理課程規劃、教案設計與學習活動。</p></article>
  </div>

  <p>
    <label for="nickname">試填暱稱（不會送出或保存）</label><br>
    <input id="nickname" type="text" placeholder="請用虛構暱稱">
  </p>
</main>

<p class="note"><strong>我的觀察：</strong>在寬畫面維持三欄；縮到 600px 以下後改為單欄，輸入欄位不超出容器。測試時應分別檢查寬畫面與窄畫面。</p>
</body>
</html>
